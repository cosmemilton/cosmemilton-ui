name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, visual, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Install Playwright Chromium
        run: npm run test:visual:install

      - name: Visual regression
        run: npm run test:visual

      - name: Build
        run: npm run build

      - name: Validate package (publint)
        run: npx publint

      - name: Validate types resolution (attw)
        # Exports de CSS não resolvem para JS/types por natureza — fora do escopo do attw.
        run: npx attw --pack . --profile esm-only --exclude-entrypoints styles.css styles.min.css components.css components.min.css

      - name: Check tarball contents
        run: |
          npm pack --dry-run --json --ignore-scripts | node -e "
            const files = JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].files.map(f => f.path);
            const stray = files.filter(f => !f.startsWith('dist/') && !f.startsWith('bin/') && !['package.json','README.md','LICENSE','CHANGELOG.md'].includes(f));
            if (stray.length) { console.error('Unexpected files in tarball:', stray); process.exit(1); }
            console.log(files.length + ' files, all expected.');
          "
